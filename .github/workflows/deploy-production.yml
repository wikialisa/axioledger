name: "🚀 Deploy Production (vnkr.vn)"

# ─────────────────────────────────────────────────────────────────────────────
# Deploys the full AxioLedger stack to the production VPS (209.97.187.235).
# Uses pm2 for process management and nginx for reverse proxy.
#
# GitHub Secrets required (Settings → Secrets → Actions):
#   VPS_SSH_PRIVATE_KEY   — Ed25519 private key (generated by installer)
#   VPS_SSH_KNOWN_HOSTS   — Output of: ssh-keyscan -H 209.97.187.235
#
# GitHub Variables (Settings → Variables → Actions):
#   VPS_HOST              — 209.97.187.235
#   VPS_USER              — root
#   VPS_DEPLOY_PATH       — /root/axioledger
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "audit/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/design-system-ci.yml"

  workflow_dispatch:
    inputs:
      filter:
        description: "Turbo filter (e.g. app-web, services/api-gateway, or empty = all)"
        required: false
        default: ""
      skip_build:
        description: "Skip build step (only restart pm2)"
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ─── 1. CI gate ─────────────────────────────────────────────────────────────
  ci-check:
    name: "🔍 CI Gate"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: "Security scan (TruffleHog)"
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.before || 'HEAD~1' }}
          head: ${{ github.sha }}
          extra_args: --only-verified
        continue-on-error: true

  # ─── 2. Deploy via SSH ───────────────────────────────────────────────────────
  deploy:
    name: "🚀 Deploy → 209.97.187.235"
    runs-on: ubuntu-latest
    needs: ci-check
    timeout-minutes: 30
    environment:
      name: production
      url: "https://vnkr.vn"

    env:
      VPS_HOST:        ${{ vars.VPS_HOST        || '209.97.187.235' }}
      VPS_USER:        ${{ vars.VPS_USER        || 'root' }}
      VPS_DEPLOY_PATH: ${{ vars.VPS_DEPLOY_PATH || '/root/axioledger' }}
      TURBO_FILTER:    ${{ github.event.inputs.filter || '' }}
      SKIP_BUILD:      ${{ github.event.inputs.skip_build || 'false' }}

    steps:
      - name: "🔑 Setup SSH"
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "${{ secrets.VPS_SSH_PRIVATE_KEY }}" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          # Use stored known_hosts or fallback to live scan
          if [ -n "${{ secrets.VPS_SSH_KNOWN_HOSTS }}" ]; then
            printf '%s\n' "${{ secrets.VPS_SSH_KNOWN_HOSTS }}" > "$HOME/.ssh/known_hosts"
          else
            ssh-keyscan -H "$VPS_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null
          fi
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: "📡 Deploy to VPS"
        run: |
          ssh -i "$HOME/.ssh/deploy_key" \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            "${VPS_USER}@${VPS_HOST}" "bash -s" << REMOTE
          set -euo pipefail

          DEPLOY_PATH="${{ env.VPS_DEPLOY_PATH }}"
          TURBO_FILTER="${{ env.TURBO_FILTER }}"
          SKIP_BUILD="${{ env.SKIP_BUILD }}"
          COMMIT="${{ github.sha }}"
          BRANCH="${{ github.ref_name }}"

          echo "════════════════════════════════════════════"
          echo "  AxioLedger Production Deploy"
          echo "  Branch : \$BRANCH"
          echo "  Commit : \$COMMIT"
          echo "  Filter : \${TURBO_FILTER:-all}"
          echo "  Path   : \$DEPLOY_PATH"
          echo "════════════════════════════════════════════"

          cd "\$DEPLOY_PATH"

          # ── 1. Git pull ──────────────────────────────────
          echo "⬇  Pulling \$COMMIT from origin/\$BRANCH ..."
          git fetch --no-tags origin "\$BRANCH"
          git checkout --detach "\$COMMIT"
          echo "✓ Checked out \$COMMIT"

          # ── 2. Install dependencies ──────────────────────
          echo "📦 Installing dependencies ..."
          pnpm install --no-frozen-lockfile --prefer-offline 2>&1 | tail -5
          echo "✓ Dependencies installed"

          # ── 3. Build ─────────────────────────────────────
          if [ "\$SKIP_BUILD" != "true" ]; then
            echo "🏗️  Building ..."
            if [ -n "\$TURBO_FILTER" ]; then
              pnpm turbo build --filter="\$TURBO_FILTER" 2>&1 | tail -20
            else
              pnpm turbo build 2>&1 | tail -20
            fi
            echo "✓ Build complete"

            # Sync static website to nginx root
            if [ -d "apps/website/out" ]; then
              rsync -a --delete apps/website/out/ /var/www/axioledger/website/
              echo "✓ Website static files synced → /var/www/axioledger/website/"
            fi
          else
            echo "⏭  Build skipped (skip_build=true)"
          fi

          # ── 4. Restart pm2 processes ─────────────────────
          echo "🔄 Restarting pm2 ..."
          if [ -n "\$TURBO_FILTER" ]; then
            # Restart only the filtered app
            pm2 restart "\$TURBO_FILTER" --update-env 2>/dev/null || true
          else
            pm2 reload ecosystem.config.js --update-env
          fi

          # Reload nginx (config may have changed)
          nginx -t && nginx -s reload
          echo "✓ Nginx reloaded"

          # Save pm2 state
          pm2 save --force

          # ── 5. Health check ───────────────────────────────
          echo "🏥 Health check ..."
          sleep 3
          FAIL=0
          for port in 5001 3001 3002 3003 3004 3005 3006 3007 3008 3009 3010 3011 3012 3013; do
            code=\$(curl -sk --max-time 5 -o /dev/null -w "%{http_code}" http://localhost:\$port/ 2>/dev/null)
            if [[ "\$code" =~ ^(200|301|302|307|308|404)$ ]]; then
              echo "  ✅ :\$port → \$code"
            else
              echo "  ❌ :\$port → \$code"
              FAIL=1
            fi
          done

          # Static website check via nginx
          ws=\$(curl -sk --max-time 5 -o /dev/null -w "%{http_code}" -H "Host: vnkr.vn" https://localhost/ 2>/dev/null)
          [ "\$ws" = "200" ] && echo "  ✅ vnkr.vn (static) → \$ws" || echo "  ⚠  vnkr.vn static → \$ws"

          if [ "\$FAIL" -eq 1 ]; then
            echo "::error::One or more services failed health check"
            exit 1
          fi

          echo ""
          echo "════════════════════════════════════════════"
          echo "  ✅ Deploy complete — $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "  🌐 https://vnkr.vn"
          echo "════════════════════════════════════════════"
          REMOTE

      - name: "📋 Write summary"
        if: always()
        run: |
          echo "## 🚀 Production Deploy — \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Filter | \`${{ github.event.inputs.filter || 'all' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Server | \`209.97.187.235\` |" >> $GITHUB_STEP_SUMMARY
          echo "| URL | https://vnkr.vn |" >> $GITHUB_STEP_SUMMARY
          echo "| Triggered by | **${{ github.actor }}** |" >> $GITHUB_STEP_SUMMARY
