name: Publish on Version Tag

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish:
    name: Publish packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org/

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter "@your-npm-org/*" build

      # ── Public packages → npmjs.com ─────────────────────────────────────────
      - name: Publish public packages to npm
        run: |
          pnpm publish -r \
            --filter "project-types" \
            --filter "project-config" \
            --filter "core-sdk" \
            --filter "project-contracts" \
            --filter "ui-kit" \
            --filter "merchant-sdk" \
            --filter "project-db" \
            --access public \
            --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # ── Restricted packages → GitHub Packages ───────────────────────────────
      - name: Publish restricted packages to GitHub Packages
        run: |
          pnpm publish -r \
            --filter "sdk-swift" \
            --filter "sdk-internal" \
            --filter "swift-adapter" \
            --filter "swift-sdk-internal" \
            --registry https://npm.pkg.github.com \
            --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
