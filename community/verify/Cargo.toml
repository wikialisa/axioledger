[package]
name        = "axio-verify"
version     = "0.1.0"
edition     = "2021"
description = "On-chain verification CLI — build artifact hash, compare with deployed bytecode"
license     = "MIT"
repository  = "https://github.com/axioledger/axioledger"

[[bin]]
name = "axio-verify"
path = "src/cli/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
hex          = "0.4"
sha2         = "0.10"
blake3       = "1"
anyhow       = "1"
clap         = { version = "4", features = ["derive"] }
reqwest      = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tokio        = { version = "1", features = ["rt-multi-thread", "macros"] }
base64       = "0.22"

[dev-dependencies]
tokio-test = "0.4"
