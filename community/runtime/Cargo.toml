[package]
name        = "axio-runtime"
version     = "0.1.0"
edition     = "2021"
description = "Bytecode execution sandbox — safe VM for on-chain logic simulation"
license     = "MIT"
repository  = "https://github.com/axioledger/axioledger"

[lib]
crate-type  = ["lib"]

[[bin]]
name = "axio-run"
path = "src/main.rs"

[dependencies]
# Minimal deps — no unsafe dependencies
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
hex          = "0.4"
sha2         = "0.10"
anyhow       = "1"
thiserror    = "1"
clap         = { version = "4", features = ["derive"] }

[dev-dependencies]
assert_matches = "1"

[features]
default = []
trace   = []   # enable opcode-level execution trace
