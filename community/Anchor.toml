# ─── Anchor.toml ──────────────────────────────────────────────────────────────
# Program IDs are read at build time from env vars (set via set-program-ids.sh).
# Fill in the real deployed addresses in programs/program-ids.config.json,
# then run:
#   source scripts/set-program-ids.sh devnet
#   anchor build
#   anchor deploy --provider.cluster devnet
#
# After a successful deploy, copy the printed program IDs back into
# programs/program-ids.config.json and this file.

[toolchain]
anchor_version = "0.30.1"
solana_version = "1.18.22"

[features]
resolution = true
skip-lint  = false

# ── Devnet ── fill after: anchor deploy --provider.cluster devnet ─────────────
[programs.devnet]
p2p_escrow      = "11111111111111111111111111111111"
mint_governance = "11111111111111111111111111111111"
amm_swap        = "11111111111111111111111111111111"
treasury_rbs    = "11111111111111111111111111111111"
swift_bridge    = "11111111111111111111111111111111"

# ── Mainnet ── fill after: anchor deploy --provider.cluster mainnet ───────────
[programs.mainnet]
p2p_escrow      = "11111111111111111111111111111111"
mint_governance = "11111111111111111111111111111111"
amm_swap        = "11111111111111111111111111111111"
treasury_rbs    = "11111111111111111111111111111111"
swift_bridge    = "11111111111111111111111111111111"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "devnet"
wallet  = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

[workspace]
members = [
    "programs/p2p-escrow",
    "programs/mint-governance",
    "programs/amm-swap",
    "programs/treasury-rbs",
    "programs/swift-bridge/solana",
]
