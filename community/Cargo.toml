[workspace]
members = [
    # ── Tầng 1: Smart Contracts ─────────────────────────────────────────
    "programs/p2p-escrow",
    "programs/mint-governance",
    "programs/amm-swap",
    "programs/treasury-rbs",
    "programs/swift-bridge/solana",

    # ── Tầng 0: VM & Bytecode Runtime ───────────────────────────────────
    # Sandbox thực thi bytecode an toàn cho giáo dục và CTF simulation
    "runtime",

    # ── Tầng 1: On-chain Verification CLI ───────────────────────────────
    # Hash artifact local vs deployed bytecode on-chain
    "verify",

    # ── Tầng 2: CTF Security Challenges ─────────────────────────────────
    # Lỗ hổng logic từ audit thực tế — học từ lỗi thật
    "ctf/challenges/reentrancy",
    "ctf/challenges/oracle-manipulation",
    "ctf/challenges/access-control-bypass",
    "ctf/challenges/flash-loan-attack",
    "ctf/challenges/signature-replay",
]
resolver = "2"

[workspace.dependencies]
anchor-lang    = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl     = { version = "0.30.1" }
solana-program = "~1.18"
sha2           = "0.10"
hex            = "0.4"

[profile.release]
overflow-checks = true
lto             = "thin"
codegen-units   = 1

[profile.dev]
overflow-checks = true
