# docker-compose.apps.yml — AXIOLEDGER Frontend Applications
#
# Quản lý riêng 15 Next.js apps. Chạy cùng với docker-compose.yml (backend stack):
#
#   docker compose \
#     -f tooling/deploy/docker/docker-compose.yml \
#     -f tooling/deploy/docker/docker-compose.apps.yml \
#     up -d
#
# Port mapping (host:container):
#   3000 — website
#   3001 — id-fiat-gateway
#   3002 — pay-portal
#   3003 — explorer-vnkrscan
#   3004 — swap-dex
#   3005 — dao-portal
#   3006 — holding-admin-portal
#   3007 — axiopass-wallet
#   3008 — axq-governance-ui
#   3009 — kpx-dex-frontend
#   3010 — app-web
#   3011 — merchant-portal
#   3012 — sandbox-dashboard
#   3013 — kyc-portal
#   3014 — digital-twin-engine (worker — no HTTP port)

version: "3.9"

x-app-build: &app-build
  context: ../..
  args:
    NODE_ENV: production

x-app-defaults: &app-defaults
  restart: unless-stopped
  env_file:
    - ../../.env
  networks:
    - AXVN-network

services:

  # ── axioledger-website [website.${BRAND_DOMAIN}] ───────────────────────────
  website:
    build:
      <<: *app-build
      dockerfile: apps/website/Dockerfile
      args:
        APP_NAME: axioledger-website
    image: axvn/website:${TAG:-latest}
    container_name: AXVN-website
    <<: *app-defaults
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://dev-api.${BRAND_DOMAIN:-localhost}}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── id-fiat-gateway [id.${BRAND_DOMAIN}] ──────────────────────────────────
